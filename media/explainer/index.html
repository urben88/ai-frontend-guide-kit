<script>

const INK='#26221c', ACCENT='#e8590c', BLUE='#2f6fed', GREEN='#2f9e44', GREY='#8a8378', RED='#d64545';
const OPTS = { stroke:INK, strokeWidth:3, roughness:1.75, bowing:1.25 };

const S = {
es:{

const CMD_INSTALL = 'npx github:urben88/ai-frontend-guide-kit';
const CMD_NPM = 'npm i -D github:urben88/ai-frontend-guide-kit';
const CMD_NPX = 'npx ai-frontend-guide-kit';

const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
let seed=20261002;
const nextSeed=()=> (seed=(Math.imul(seed,48271))%2147483647);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOut=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};

const anims=[], hAnims=[], customs=[], scenes=[];

function newSvg(parent){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','doodles');
  svg.setAttribute('viewBox','0 0 1920 1080');
  parent.appendChild(svg);
  return svg;
}
function G(parent){ const g=document.createElementNS(NS,'g'); parent.appendChild(g); return g; }
function add(parent,shape){ parent.appendChild(shape); return shape; }
function rect(p,x,y,w,h,o={}){ return add(p, rough.svg(p).rectangle(x,y,w,h,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function circ(p,cx,cy,d,o={}){ return add(p, rough.svg(p).circle(cx,cy,d,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function ell(p,cx,cy,w,h,o={}){ return add(p, rough.svg(p).ellipse(cx,cy,w,h,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function line(p,x1,y1,x2,y2,o={}){ return add(p, rough.svg(p).line(x1,y1,x2,y2,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function poly(p,pts,o={}){ return add(p, rough.svg(p).polygon(pts,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function rcurve(p,pts,o={}){ return add(p, rough.svg(p).curve(pts,Object.assign({},OPTS,{seed:nextSeed()},o))); }
function stxt(p,x,y,str,size,o={}){
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('font-size',size);
  t.setAttribute('fill',o.fill||INK);
  t.setAttribute('font-family', o.hand ? "Caveat,'Comic Sans MS',cursive" : "'Patrick Hand','Comic Sans MS',cursive");
  t.setAttribute('text-anchor',o.anchor||'start');
  if(o.weight) t.setAttribute('font-weight',o.weight);
  t.textContent=str; p.appendChild(t); return t;
}
function arrow(p,x1,y1,x2,y2,o={}){
  const g=G(p);
  line(g,x1,y1,x2,y2,o);
  const a=Math.atan2(y2-y1,x2-x1), s=o.head||22;
  line(g,x2,y2,x2-s*Math.cos(a-0.42),y2-s*Math.sin(a-0.42),o);
  line(g,x2,y2,x2-s*Math.cos(a+0.42),y2-s*Math.sin(a+0.42),o);
  return g;
}
function xmark(p,cx,cy,s,o={}){
  const g=G(p); const c=Object.assign({},OPTS,{stroke:RED,strokeWidth:6},o);
  line(g,cx-s/2,cy-s/2,cx+s/2,cy+s/2,c);
  line(g,cx-s/2,cy+s/2,cx+s/2,cy-s/2,c);
  return g;
}
function checkSvg(p,cx,cy,s,o={}){
  const g=G(p); const c=Object.assign({},OPTS,{stroke:GREEN,strokeWidth:6},o);
  line(g,cx-s/2,cy,cx-s/8,cy+s/2,c);
  line(g,cx-s/8,cy+s/2,cx+s/2,cy-s/2,c);
  return g;
}
function star(p,cx,cy,r,o={}){
  const pts=[];
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]); }
  return poly(p,pts,o);
}
function sparkSvg(p,cx,cy,s,o={}){
  const c=Object.assign({},OPTS,{stroke:ACCENT,strokeWidth:4},o);
  const g=G(p);
  line(g,cx-s,cy,cx+s,cy,c); line(g,cx,cy-s,cx,cy+s,c);
  line(g,cx-s*.55,cy-s*.55,cx+s*.55,cy+s*.55,c);
  line(g,cx-s*.55,cy+s*.55,cx+s*.55,cy-s*.55,c);
  return g;
}
function browser(p,x,y,w,h,o={}){
  const g=G(p);
  rect(g,x,y,w,h,o);
  line(g,x+2,y+46,x+w-2,y+46,o);
  circ(g,x+26,y+24,12,o); circ(g,x+48,y+24,12,o);
  return g;
}
function magnifier(p,cx,cy,r,o={}){
  const g=G(p);
  circ(g,cx,cy,r*2,o);
  line(g,cx+r*.72,cy+r*.72,cx+r*1.7,cy+r*1.7,Object.assign({},o,{strokeWidth:(o.strokeWidth||3)+1}));
  return g;
}
function shieldSvg(p,cx,cy,w,h,o={}){
  const pts=[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h*.12],[cx,cy+h/2],[cx-w/2,cy+h*.12]];
  return poly(p,pts,o);
}
function camera(p,x,y,s,o={}){
  const g=G(p);
  rect(g,x,y,s*130,s*86,o);
  circ(g,x+s*65,y+s*43,s*46,o);
  rect(g,x+s*20,y-s*16,s*42,s*18,o);
  return g;
}
function polaroid(p,x,y,w,o={}){
  const g=G(p);
  rect(g,x,y,w,w*.84,o);
  rect(g,x+14,y+14,w-28,w*.84-40,Object.assign({},o,{strokeWidth:2.2}));
  return g;
}
function terminal(p,x,y,w,h,o={}){
  const g=G(p);
  rect(g,x,y,w,h,o);
  line(g,x+2,y+52,x+w-2,y+52,o);
  circ(g,x+26,y+27,12,o); circ(g,x+50,y+27,12,o); circ(g,x+74,y+27,12,o);
  return g;
}
function archive(p,x,y,w,h,o={}){
  const g=G(p);
  rect(g,x,y,w,h,o);
  line(g,x,y+h*.3,x+w,y+h*.3,o);
  rect(g,x+w*.36,y-16,w*.28,18,Object.assign({},o,{strokeWidth:2.4}));
  return g;
}
function person(p,cx,cy,s,o={}){
  const g=G(p);
  circ(g,cx,cy-28*s,36*s,o);
  line(g,cx,cy-10*s,cx,cy+28*s,o);
  line(g,cx,cy+28*s,cx-18*s,cy+56*s,o);
  line(g,cx,cy+28*s,cx+18*s,cy+56*s,o);
  line(g,cx,cy-2*s,cx-22*s,cy+16*s,o);
  line(g,cx,cy-2*s,cx+22*s,cy+16*s,o);
  return g;
}
function cursorSvg(p,x,y,s,o={}){
  const pts=[[0,0],[0,26],[7,20],[13,31],[19,28],[13,17],[23,17]].map(a=>[x+a[0]*s,y+a[1]*s]);
  return poly(p,pts,Object.assign({fill:INK,fillStyle:'solid',stroke:'none',strokeWidth:0},o));
}
function planeSvg(p,o={}){
  const g=G(p);
  poly(g,[[-20,12],[-6,3],[24,0],[-6,-3],[-20,-12],[-9,0]],Object.assign({fill:'#fff',fillStyle:'solid'},o));
  return g;
}

function animSvg(g,t0,dur,mode='draw'){
  const items=[...g.querySelectorAll('path')].map(p=>({p,len:p.getTotalLength()}));
  if(mode!=='fade') items.forEach(({p,len})=>{ p.style.strokeDasharray=String(len); p.style.strokeDashoffset=String(len); });
  if(mode!=='draw') g.style.opacity='0';
  anims.push({g,items,t0,dur,mode});
  return g;
}
const ink=(g,t0,dur=0.7)=>animSvg(g,t0,dur,'draw');
const appear=(g,t0,dur=0.4)=>animSvg(g,t0,dur,'fade');

function T(parent,x,y,html,style={}){
  const n=document.createElement('div');
  n.className='txt'+(style.cls?' '+style.cls:'');
  n.innerHTML=html;
  n.style.left=x+'px'; n.style.top=y+'px';
  Object.assign(n.style,style.css||{});
  parent.appendChild(n);
  return n;
}
function popIn(node,t0,dur=0.45,mode='up',dy=30){
  node.style.opacity='0';
  hAnims.push({node,t0,dur,mode,dy});
  return node;
}
function blob(parent,cx,cy,r,color,op){
  const d=document.createElement('div');
  d.className='blob';
  d.style.left=(cx-r)+'px'; d.style.top=(cy-r)+'px'; d.style.width=d.style.height=(r*2)+'px';
  d.style.background=color; d.style.opacity=op;
  parent.appendChild(d); return d;
}
function sparkHTML(parent,x,y,s,color,t0){
  const n=document.createElement('div');
  n.className='spark';
  n.style.left=x+'px'; n.style.top=y+'px'; n.style.width=n.style.height=s+'px';
  n.innerHTML='<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'"><path d="M12 1.6c.7 5.6 4.8 9.7 10.4 10.4-5.6.7-9.7 4.8-10.4 10.4C11.3 16.8 7.2 12.7 1.6 12 7.2 11.3 11.3 7.2 12 1.6Z" fill="'+(color||ACCENT)+'"/></svg>';
  parent.appendChild(n);
  popIn(n,t0,0.5,'pop');
  return n;
}
function checkHTML(parent,x,y,size,color,t0,tilt=0){
  const wrap=document.createElement('div');
  wrap.style.position='absolute'; wrap.style.left=x+'px'; wrap.style.top=y+'px';
  wrap.style.width=size+'px'; wrap.style.height=size+'px';
  wrap.style.transformOrigin='center';
  const inner=document.createElement('div');
  inner.style.width='100%'; inner.style.height='100%';
  inner.style.borderRight='7px solid '+(color||GREEN);
  inner.style.borderBottom='7px solid '+(color||GREEN);
  inner.style.transform='rotate('+(45+tilt)+'deg) scale(.82)';
  inner.style.transformOrigin='center';
  wrap.appendChild(inner); parent.appendChild(wrap);
  popIn(wrap,t0,0.45,'pop');
  return wrap;
}

function scene(start,dur,{camX=0,camY=0}={}){
  const root=document.createElement('div'); root.className='scene';
  const cam=document.createElement('div'); cam.className='cam';
  root.appendChild(cam); stage.appendChild(root);
  const svg=newSvg(cam);
  const s={root,cam,svg,start,dur,camX,camY};
  scenes.push(s); return s;
}

/* ============================== SCENE 1 ============================== */
(function(){
  const s=scene(0,6,{camX:-26,camY:12});
  blob(s.cam,1500,250,320,'#e8590c',0.05); blob(s.cam,300,900,300,'#2f6fed',0.05);

  popIn(T(s.cam,150,84,S.s1.title,{cls:'hand',css:{fontSize:'92px'}}),0.15,0.6);
  ink(rcurve(s.svg,[[152,214],[430,206],[820,216],[1060,208]],{stroke:ACCENT,strokeWidth:7,roughness:2.1}),0.85,0.8);

  [0,1,2].forEach(i=>{
    const y=300+i*64;
    xmark(s.svg,186,y+26,24);
    const n=T(s.cam,232,y,String(S.s1.words[i]),{css:{fontSize:'44px',color:INK}});
    popIn(n,1.05+i*0.28,0.4,'left');
  });

  ink(browser(s.svg,620,320,740,440),0.55,1.0);
  ink(line(s.svg,660,430,1240,430),1.3,0.35);
  ink(line(s.svg,660,478,1240,478),1.5,0.35);
  ink(line(s.svg,660,526,1080,526),1.7,0.35);
  popIn(T(s.cam,880,470,'?',{cls:'hand',css:{fontSize:'230px',color:ACCENT,lineHeight:'1'}}),1.5,0.5,'pop');

  const cur=cursorSvg(s.svg,1050,660,2.2);
  animSvg(cur,1.9,0.3,'fade');
  customs.push({t0:0,t1:TOTAL,fn:(p,t)=>{ cur.style.opacity = t<1.9 ? '0' : (Math.floor(t*2.2)%2 ? '0.12' : '1'); }});

  const cf=G(s.svg);
  circ(cf,300,640,200); 
  for(let i=0;i<12;i++){ const a=i*Math.PI/6; line(cf,300+Math.cos(a)*86,640+Math.sin(a)*86,300+Math.cos(a)*96,640+Math.sin(a)*96,{strokeWidth:2}); }
  ink(cf,1.0,0.8);
  const hrG=G(s.svg); line(hrG,300,640,300,578,{strokeWidth:5,stroke:INK});
  const minG=G(s.svg); line(minG,300,640,300,556,{strokeWidth:4,stroke:ACCENT});
  customs.push({t0:0,t1:TOTAL,fn:(p,t)=>{
    const on = t>1.2 ? 1 : 0;
    hrG.style.opacity=String(on); minG.style.opacity=String(on);
    minG.setAttribute('transform','rotate('+((t*160)%360)+' 300 640)');
    hrG.setAttribute('transform','rotate('+((t*14)%360)+' 300 640)');
  }});

  [[1490,300,11],[1520,500,12],[1480,700,13]].forEach((c,i)=>{
    const g=G(s.svg);
    g.setAttribute('transform','translate('+c[0]+' '+c[1]+')');
    rect(g,0,0,240,160,{seed:c[2]});
    stxt(g,20,46,'</>',44,{fill:GREY});
    stxt(g,20,100,'{'+(i+1)+'}',30,{fill:GREY});
    ink(g,2.3+i*0.3,0.7);
  });
  ink(arrow(s.svg,1620,470,1640,500),3.3,0.4); ink(arrow(s.svg,1610,670,1600,700),3.5,0.4);

  const cp=T(s.cam,1530,900,S.s1.copy,{cls:'hand',css:{fontSize:'52px',color:GREY}});
  popIn(cp,4.0,0.4);
  ink(line(s.svg,1524,932,1750,922,{stroke:RED,strokeWidth:6}),4.5,0.4);
  sparkSvg(s.svg,1420,260,16); 
})();

/* ============================== SCENE 2 ============================== */
(function(){
  const s=scene(6,7,{camX:22,camY:-10});
  blob(s.cam,1200,500,360,'#2f9e44',0.05); blob(s.cam,400,300,300,'#e8590c',0.05);

  popIn(T(s.cam,150,84,S.s2.title,{cls:'hand',css:{fontSize:'92px'}}),6.15,0.6);
  ink(rcurve(s.svg,[[152,214],[400,206],[700,214],[950,208]],{stroke:ACCENT,strokeWidth:7,roughness:2}),6.85,0.7);

  ink(browser(s.svg,950,330,560,430),6.5,0.9);
  for(let i=0;i<3;i++){

  const cards=[[330,220,S.s2.f1,'16'],[500,220,S.s2.f2, S.s2.f2==='componentes'?'2.470':'2,470'],[670,220,S.s2.f3,'20']];
  const nums=[];
  cards.forEach((c,i)=>{
    ink(rect(s.svg,170,c[0],430,120),6.45+i*0.3,0.7);
    const num=T(s.cam,200,c[0]+18,c[3],{cls:'hand',css:{fontSize:'62px',color:i===1?ACCENT:INK,lineHeight:'1'}});

  });
  customs.push({t0:7.15,t1:8.25,fn:(p)=>{
    nums[1].textContent=(S.s2.f2==='componentes'?'2.470':'2,470');
    const n=Math.round(2470*eOut(p));
    const str=String(n).replace(/\B(?=(\d{3})+(?!\d))/g, S.s2.f2==='componentes'?'.':',');
    nums[1].textContent=str;
  }});

  const chip=ink(rect(s.svg,950,830,820,110),9.5,0.8);
  const cmd=T(s.cam,1000,858,'',{cls:'hand',css:{fontSize:'44px',color:INK,lineHeight:'1'}});
  popIn(cmd,9.7,0.3);
  customs.push({t0:10.0,t1:11.7,fn:(p)=>{ cmd.textContent=CMD_INSTALL.slice(0,Math.round(p*CMD_INSTALL.length)); }});
  const blk=document.createElement('span');

  blk.style.background=ACCENT; blk.style.verticalAlign='-4px'; blk.style.marginLeft='4px';
  cmd.appendChild(blk);
  customs.push({t0:10,t1:TOTAL,fn:(p,t)=>{ blk.style.opacity=Math.floor(t*2.4)%2?'0.1':'1'; }});

  const tagG=ink(poly(s.svg,[[1530,300],[1730,280],[1760,400],[1560,430]],{stroke:ACCENT}),11.8,0.7);
  ink(circ(s.svg,1580,335,16),12.1,0.3);

/* ============================== RENDER ENGINE ============================== */
function renderAt(t){
  t = clamp(t,0,TOTAL);
  scenes.forEach((s,i)=>{
    const a = i===0 ? 1 : clamp((t-(s.start-FADE))/FADE,0,1);
    const b = clamp(((s.start+s.dur)-t)/FADE,0,1);
    s.root.style.opacity = String(Math.min(a,b));
    const p = t<s.start?0:clamp((t-s.start)/s.dur,0,1);
    const z = 1+0.025*p, tx=s.camX*(p-0.5), ty=s.camY*(p-0.5);
    s.cam.style.transform = 'scale('+z+') translate('+tx+'px,'+ty+'px)';
  });
  for(const a of anims){
    const p=clamp((t-a.t0)/a.dur,0,1), e=eOut(p);
    if(a.mode!=='fade') for(const it of a.items) it.p.style.strokeDashoffset=String(it.len*(1-e));
    if(a.mode!=='draw') a.g.style.opacity=String(eOut(clamp(p*1.5,0,1)));
  }
  for(const a of hAnims){
    const p=clamp((t-a.t0)/a.dur,0,1), e=eOut(p);
    a.node.style.opacity=String(clamp(p*2,0,1));
    if(a.mode==='up') a.node.style.transform='translateY('+((1-e)*a.dy)+'px)';
    else if(a.mode==='pop') a.node.style.transform='scale('+(0.4+0.6*eBack(p))+')';
    else if(a.mode==='left') a.node.style.transform='translateX('+((1-e)*-a.dy)+'px)';
    else if(a.mode==='right') a.node.style.transform='translateX('+((1-e)*a.dy)+'px)';
    else a.node.style.transform='none';
  }
  for(const c of customs) c.fn(clamp((t-c.t0)/(c.t1-c.t0),0,1), t);
  return t;
}
function fit(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')';
}
let raf=null;
function playback(){
  const t0=performance.now();
  const loop=()=>{ renderAt(((performance.now()-t0)/1000)%TOTAL); raf=requestAnimationFrame(loop); };
  loop();
}
window.addEventListener('resize',fit);
window.renderAt=renderAt;
window.TOTAL_DURATION=TOTAL;
window.FPS=FPS;
window.__ready=false;
fit();
renderAt(FIXED_T!=null&&!isNaN(FIXED_T)?FIXED_T:0);
document.fonts.ready.then(()=>{ if(FIXED_T!=null&&!isNaN(FIXED_T)) renderAt(FIXED_T); requestAnimationFrame(()=>{ window.__ready=true; }); });
if(FIXED_T==null&&!RENDER) playback();
</script>
