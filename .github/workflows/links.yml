name: Link check

on:
  schedule:
    - cron: '0 7 15 * *'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stratified docs_url check (fails when more than 10% of the sample is broken)
        run: node tools/validate.mjs --urls 200
